# 의존성 좌표·버전의 단일 출처.
#
# 규칙:
# - 모듈 build.gradle.kts에 좌표/버전 문자열 하드코딩 금지 — 여기 등록 후 libs.* 로 참조한다.
# - 새 항목은 그것을 사용하는 코드가 생기는 커밋에서 함께 등록한다. 미리 채워두지 않는다.
# - Spring 계열은 버전 없이 등록한다(BOM이 해석 — BOM이 적용된 모듈에서만 해석됨).
#   비 Spring은 [versions]에 버전을 명시한다.
# - 버전 올리기 = 여기 한 줄 수정. 모듈 파일은 건드리지 않는다.

[versions]
kotlin = "2.2.21"                # Boot 4의 Kotlin baseline(2.2 계열) — Gradle 9 지원 패치
spring-boot = "4.0.5"            # 4.0.x 최신 패치 추종 — actuator·코어 버전 정렬 (혼합 시 NoSuchMethodError)
jakarta-persistence = "3.2.0"    # domain은 BOM 밖이라 직접 관리 — Boot BOM의 JPA 버전과 일치 유지
jakarta-servlet = "6.1.0"        # web-common 컴파일 전용 (런타임은 실행 모듈의 내장 톰캣이 제공)
slf4j = "2.0.17"
ktlint-gradle = "14.2.0"         # org.jlleitschuh.gradle.ktlint 래퍼
ktlint = "1.8.0"                 # ktlint 코어
springdoc = "3.0.3"              # OpenAPI 3/Swagger UI
spring-cloud-aws = "4.0.2"       # Boot 4.x 호환 계열(4.0.x) 최신 패치 — 3.x는 Boot 4에서 미동작

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
jakarta-persistence = { module = "jakarta.persistence:jakarta.persistence-api", version.ref = "jakarta-persistence" }

# --- web-common: HTTP 번역 계층 ---
spring-web = { module = "org.springframework:spring-web" }
jakarta-servlet-api = { module = "jakarta.servlet:jakarta.servlet-api", version.ref = "jakarta-servlet" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }

# --- application: 유스케이스 조율 계층 ---
spring-context = { module = "org.springframework:spring-context" }
spring-tx = { module = "org.springframework:spring-tx" }

# --- infra:persistence: domain 포트의 JPA 어댑터 ---
spring-data-jpa = { module = "org.springframework.data:spring-data-jpa" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }  # flyway-core + Boot 4 분리형 자동 구성(spring-boot-flyway)
flyway-mysql = { module = "org.flywaydb:flyway-mysql" }    # Flyway 10+ MySQL 지원 분리 모듈

# --- 인증(ACC-01): 자체 RS256 JWT·소셜 id_token 검증 ---
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
spring-security-oauth2-jose = { module = "org.springframework.security:spring-security-oauth2-jose" }
spring-boot = { module = "org.springframework.boot:spring-boot" }    # @ConfigurationProperties — infra 어댑터의 설정 바인딩용
jackson-databind = { module = "tools.jackson.core:jackson-databind" } # web-security 필터가 에러 응답(ErrorResponse)을 JSON으로 쓸 때 사용 — Boot 4 = Jackson 3, 버전은 BOM이 해석

# --- infra:redis: refresh token 저장소 ---
spring-boot-starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
spring-data-redis = { module = "org.springframework.data:spring-data-redis" }

# --- infra:s3-client ---
spring-cloud-aws-starter-s3 = { module = "io.awspring.cloud:spring-cloud-aws-starter-s3" }

# --- 실행 모듈(api·batch) 조립용 ---
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" } # ALB 헬스체크(/actuator/health) — 배포 전제조건
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }

# --- api: API 문서화 (OpenAPI 3 / Swagger UI) ---
springdoc-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }

# --- api: 부팅 시 SSM Parameter Store에서 설정 로드 (spring.config.import) ---
spring-cloud-aws-bom = { module = "io.awspring.cloud:spring-cloud-aws-dependencies", version.ref = "spring-cloud-aws" }
spring-cloud-aws-starter-parameter-store = { module = "io.awspring.cloud:spring-cloud-aws-starter-parameter-store" }  # 버전은 위 BOM이 해석

# --- domain: 외부 노출 식별자(ULID) — 전이 의존 0·순수 Java. domain 허용 의존(A-1 계보, 10 문서 §2-2) ---
ulid-creator = { module = "com.github.f4b6a3:ulid-creator", version = "5.2.4" }
mysql-connector-j = { module = "com.mysql:mysql-connector-j" }  # 실 DB(RDS MySQL 8.4) 드라이버
h2 = { module = "com.h2database:h2" }    # 임시 내장 DB

# --- boot 테스트: Testcontainers MySQL 통합 테스트를 위함. 버전은 Boot BOM이 관리 ---
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
testcontainers-mysql = { module = "org.testcontainers:testcontainers-mysql" }

# --- build-logic 전용: 컨벤션이 적용할 플러그인의 구현체 (플러그인 버전은 여기서 결정된다) ---
gradleplugin-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
gradleplugin-kotlin-allopen = { module = "org.jetbrains.kotlin:kotlin-allopen", version.ref = "kotlin" }
gradleplugin-kotlin-noarg = { module = "org.jetbrains.kotlin:kotlin-noarg", version.ref = "kotlin" }
gradleplugin-spring-boot = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
gradleplugin-ktlint = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint-gradle" }
