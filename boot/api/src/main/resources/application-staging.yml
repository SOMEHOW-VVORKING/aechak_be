# staging — prod와 동일 구조, SSM /aechak/staging/api/ 에서 로드. yml은 어떤 값이 필요한지 명시하는 계약서
spring:
  config:
    import: aws-parameterstore:/aechak/staging/api/   # staging 인프라 구축 시 이 경로에 파라미터를 만들어야 부팅됨
  datasource:
    url: ${SPRING_DATASOURCE_URL}           # 필수 — 미존재 시 부팅 실패(fail-fast)
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}

api:
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}

auth:
  web:
    return-urls: ${AUTH_WEB_RETURN_URLS:}
    callback-base-url: ${AUTH_WEB_CALLBACK_BASE_URL:}

server:
  forward-headers-strategy: framework   # LB가 TLS를 종료해도 원 요청 스킴 기준으로 동작(Secure 쿠키·리다이렉트 URL)
