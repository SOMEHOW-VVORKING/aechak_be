# 로컬 개발 — MySQL·Redis는 docker compose로 기동
# 기본값 = compose 표준값. 개인 오버라이드·로컬 비밀은 IntelliJ Run Config의 환경변수로 주입 (env가 기본값을 이김)
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/aechak}
    username: ${SPRING_DATASOURCE_USERNAME:app}
    password: ${SPRING_DATASOURCE_PASSWORD:local}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: update

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}   # docker compose 기본값
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer   # value = 엔벨로프 JSON 문자열
      acks: all                        # 단일 브로커에선 acks=1과 사실상 같지만, 브로커 늘리는 날 옳도록 지금 명시
      properties:
        enable.idempotence: true       # 전송 재시도로 인한 중복·재정렬 방지 (Kafka 3+ 기본이지만 명시)
        linger.ms: 10

api:
  cors-allowed-origins: http://localhost:5175,http://localhost:5173   # web-buyer dev(5175) + 기타 웹 앱

aws:
  s3:
    media-bucket: ${AWS_S3_MEDIA_BUCKET}
    docs-bucket: ${AWS_S3_DOCS_BUCKET}

auth:
  web:
    # return은 화이트리스트 "정확 일치"만 통과 — 오픈 리다이렉트 방지.
    return-urls:
      - http://localhost:5175/login/complete   # web-buyer dev 포트(vite --port 5175)
      - http://localhost:5173/login/complete
    callback-base-url: http://localhost:8080/api/v1/auth/callback   # provider 콘솔에 등록하는 주소의 밑동
