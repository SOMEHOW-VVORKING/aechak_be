# dev 서버 — 값은 부팅 시 SSM /aechak/dev/api/ 에서 로드(아래 import). yml은 어떤 값이 필요한지 명시하는 계약서
spring:
  config:
    import: aws-parameterstore:/aechak/dev/api/   # SSM 접근 실패(권한·네트워크) 시 부팅 실패
  datasource:
    url: ${SPRING_DATASOURCE_URL}           # RDS - 필수, 미존재 시 부팅 실패(fail-fast)
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}       # ElastiCache
      port: ${SPRING_DATA_REDIS_PORT}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}   # EC2 Kafka 고정 IP — 필수, 미존재 시 부팅 실패(fail-fast)
  jpa:
    hibernate:
      ddl-auto: update                      # RDS 스키마 부트스트랩 — 전체 DDL 이관 완료 시 validate로

api:
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}       # 예: https://dev.aechak.com (쉼표 구분 복수 가능)

aws:
  s3:
    media-bucket: ${AWS_S3_MEDIA_BUCKET}
    docs-bucket: ${AWS_S3_DOCS_BUCKET}

auth:
  web:
    return-urls: ${AUTH_WEB_RETURN_URLS:}              # 예: https://dev.aechak.com/login/complete (쉼표 구분)
    callback-base-url: ${AUTH_WEB_CALLBACK_BASE_URL:}  # 예: https://api-dev.aechak.com/api/v1/auth/callback

server:
  forward-headers-strategy: framework   # LB가 TLS를 종료해도 원 요청 스킴 기준으로 동작(Secure 쿠키·리다이렉트 URL)
