# dev 서버 — 값은 부팅 시 SSM /aechak/dev/api/ 에서 로드(아래 import). yml은 어떤 값이 필요한지 명시하는 계약서
spring:
  config:
    import: aws-parameterstore:/aechak/dev/api/   # SSM 접근 실패(권한·네트워크) 시 부팅 실패
  datasource:
    url: ${SPRING_DATASOURCE_URL}           # RDS - 필수, 미존재 시 부팅 실패(fail-fast)
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      # RDS 가 db.t4g.micro 라 max_connections 가 약 60 이다. 보트 넷이 각자 기본 10 을 잡고
      # 롤링 배포에서 구형·신형 태스크가 겹치면 두 배가 되어 1040(Too many connections)이 난다.
      # 구매자 트래픽을 받는 쪽이라 가장 크게 준다
      maximum-pool-size: 6
      minimum-idle: 1
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}       # ElastiCache
      port: ${SPRING_DATA_REDIS_PORT}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}   # EC2 Kafka 고정 IP — 필수, 미존재 시 부팅 실패(fail-fast)
  jpa:
    hibernate:
      ddl-auto: update                      # RDS 스키마 부트스트랩 — 전체 DDL 이관 완료 시 validate로

api:
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}       # 구매자·셀러·어드민 웹 오리진 전부 (쉼표 구분)

aws:
  s3:
    media-bucket: ${AWS_S3_MEDIA_BUCKET}
    docs-bucket: ${AWS_S3_DOCS_BUCKET}

auth:
  web:
    return-urls: ${AUTH_WEB_RETURN_URLS:}              # 예: https://dev.aechak.co.kr/login/complete (쉼표 구분, 세 웹 모두)
    callback-base-url: ${AUTH_WEB_CALLBACK_BASE_URL:}  # 예: https://api-dev.aechak.co.kr/api/v1/auth/callback

# 실발송(CoolSMS) 설정 — 3개 모두 필수, 미존재 시 부팅 실패(fail-fast). 값은 SSM 수기 등재
sms:
  coolsms:
    api-key: ${COOLSMS_API_KEY}
    api-secret: ${COOLSMS_API_SECRET}
    from: ${COOLSMS_FROM}             # CoolSMS 콘솔에 등록·인증된 발신번호

server:
  forward-headers-strategy: framework   # LB가 TLS를 종료해도 원 요청 스킴 기준으로 동작(Secure 쿠키·리다이렉트 URL)

# AI 검수. 섀도 단계에서는 요청만 보내고 노출 상태는 바꾸지 않는다.
inspection:
  enabled: true
  # 노출 게이트는 끈 채로 둔다. 쌓인 판정의 품질을 보고 켠다 — 켜는 순간 구매자 화면이 바뀐다.
  gate-enabled: false
