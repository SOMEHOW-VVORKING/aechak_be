spring:
  application:
    name: aechak-api
  lifecycle:
    timeout-per-shutdown-phase: 20s
  cloud:
    aws:
      region:
        static: ap-northeast-2 # 리전 자동탐지 제거 — CI 러너처럼 AWS 설정 없는 환경에선 탐지 실패로 부팅이 깨짐

# ECS 롤링 시 SIGTERM을 받으면 처리 중 요청까지는 끝내고 종료
server:
  shutdown: graceful

# ALB 헬스체크용. health 외 엔드포인트는 민감정보라 노출 금지
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never # 상세 상태는 숨김
  health:
    redis:
      enabled: false # Redis 장애로 앱 전체가 unhealthy 판정되는 것 방지

