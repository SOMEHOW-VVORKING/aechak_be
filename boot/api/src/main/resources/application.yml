spring:
  application:
    name: aechak-api
  lifecycle:
    timeout-per-shutdown-phase: 20s
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  cloud:
    aws:
      region:
        static: ap-northeast-2 # 리전 자동탐지 제거 — CI 러너처럼 AWS 설정 없는 환경에선 탐지 실패로 부팅이 깨짐

# ECS 롤링 시 SIGTERM을 받으면 처리 중 요청까지는 끝내고 종료
server:
  shutdown: graceful

# ALB 헬스체크용. health 외 엔드포인트는 민감정보라 노출 금지
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never # 상세 상태는 숨김
  health:
    redis:
      enabled: false # Redis 장애로 앱 전체가 unhealthy 판정되는 것 방지

# 이 파일은 전 환경 공통(정책값·불변 엔드포인트)만 담는다.
# datasource·redis는 프로파일 yml 소유 (dev=SSM 로드, local=docker compose 표준값).
# 환경마다 달라지는 값(CORS origin, 웹 로그인 return/callback URL, forward-headers)은 application-{profile}.yml로.
# 시크릿(카카오 REST 키, JWT 키)은 파일에 두지 않고 환경변수로 주입한다 — local은 .env, prod는 SSM.

api:
  base-path: /api/v1         # 컨트롤러 접두(WebConfig)·Security 매처·온보딩 화이트리스트·쿠키 Path가 함께 참조

aws:
  s3:
    # local은 .env로 dev 버킷을 지정한다. 비면 부팅은 되고 발급 시 실패 — dev/prod는 프로파일 yml이 fail-fast
    media-bucket: ${AWS_S3_MEDIA_BUCKET:}
    docs-bucket: ${AWS_S3_DOCS_BUCKET:}
    # media 앞단(CDN) 공개 도메인 — 표시용 URL(key→URL) 조립. 비면 상대경로(/key)로 내려간다(이미지 미노출 수준, 부팅 무영향)
    media-public-base-url: ${AWS_S3_MEDIA_PUBLIC_BASE_URL:}

auth:
  token:
    access-ttl: 30m          # 수치 팀 미확정 — 기본 제안값
    refresh-ttl: 7d          # 주 1회 이상 접속하면 로그인 유지(회전마다 리셋), 7일 미접속 시 재로그인
    rotation-grace: 60s
  jwt:
    # RS256 PEM — prod는 SSM(/aechak/{env}/auth/jwt-private-key) 주입.
    # 비워두면 개발용 임시 키 생성(재시작 시 기존 토큰 전부 무효 — local 한정).
    private-key: ${AUTH_JWT_PRIVATE_KEY:}
    public-key: ${AUTH_JWT_PUBLIC_KEY:}
  web:
    # 서버 콜백 로그인 정책값. return 화이트리스트·콜백 주소는 환경별 프로파일에서 정의한다.
    state-ttl: 5m
  social:
    providers:
      kakao:
        jwks-uri: https://kauth.kakao.com/.well-known/jwks.json
        issuer: https://kauth.kakao.com
        authorize-uri: https://kauth.kakao.com/oauth/authorize   # 웹 로그인 진입(서버 콜백 플로우)
        token-uri: https://kauth.kakao.com/oauth/token           # code → id_token 교환
        client-id: ${KAKAO_CLIENT_ID:}   # 카카오 REST API 키 (비면 웹 로그인·code 채널 비활성)
        client-secret: ${KAKAO_CLIENT_SECRET:}   # 콘솔 보안 탭에서 "사용함"이면 필수 — 없으면 교환이 KOE010으로 거부
        audiences: []        # 채널별 키 병기: 네이티브 앱 키 + REST 키 (비면 aud 검증 생략)
      apple:
        jwks-uri: https://appleid.apple.com/auth/keys
        issuer: https://appleid.apple.com
        audiences: []        # 채널별 키 병기: iOS 번들 ID + 웹(SIWA JS) Services ID
# PENDING_ONBOARDING 허용 경로는 SecurityConfig.onboardingAllowedPaths 상수로 관리(인가 규칙이라 설정이 아닌 코드 소유)

# PII 암호화 키 — dev·prod는 SSM(terraform이 생성·등재), local·test는 프로파일 파일의 고정 키가 덮는다.
# 기본값을 주지 않는다: 미주입이면 부팅 실패(fail-fast). JWT식 임시 키 폴백 금지 — PII 키 분실 = 데이터 영구 복호 불능.
aechak:
  pii:
    active-version: 1        # 암호화에 쓸 키 버전. 로테이션 시 새 버전 키를 aes-keys에 추가하고 이 값을 올린다
    aes-keys:
      1: ${PII_AES_KEY_V1}   # base64 32바이트
    hmac-key: ${PII_HMAC_KEY} # base64 32바이트 — 검색용 해시 키(AES와 분리, 평문 등가 시크릿)
