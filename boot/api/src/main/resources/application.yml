spring:
  application:
    name: aechak-api
  lifecycle:
    timeout-per-shutdown-phase: 20s
  flyway:
    baseline-on-migrate: true
    baseline-version: 0

  jpa:
    open-in-view: false
  cloud:
    aws:
      region:
        static: ap-northeast-2 # AWS 설정이 없는 CI에서도 시작할 수 있도록 리전을 직접 지정한다.

  # 브로커 주소(bootstrap-servers)만 프로파일 yml 소유 — local은 compose 기본값,
  # dev/prod는 datasource처럼 SSM에서 fail-fast 로드(terraform ec2.tf가 파라미터 생성).
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer   # value = 엔벨로프 JSON 문자열
      acks: all                        # 단일 브로커에선 acks=1과 사실상 같지만, 브로커 늘리는 날 옳도록 지금 명시
      properties:
        enable.idempotence: true       # 전송 재시도로 인한 중복과 재정렬 방지 (Kafka 3+ 기본이지만 명시)
        max.block.ms: 5000             # 브로커 완전 다운 시 send() 호출 자체가 막히는 상한 (기본 60초)
        request.timeout.ms: 5000       # 요청 1회 응답 대기 (기본 30초)
        delivery.timeout.ms: 10000     # 내부 재시도 1회 포함 총 상한 (기본 120초)
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest   # 새 그룹은 처음부터 재처리 (이벤트는 건너뛰기보다 재처리가 안전)
    listener:
      ack-mode: RECORD              # 장애 후 다시 전달되는 범위를 줄이기 위해 레코드마다 오프셋을 커밋
      concurrency: 1                # 파티션 수 이하로. 스케일은 파티션부터 늘리고 그다음 이 값

# TraceIdFilter와 TraceIdRecordInterceptor가 MDC에 넣은 traceId를 로그 레벨 옆에 표시
logging:
  pattern:
    level: "%5p [%X{traceId:-}]"

# ECS 롤링 시 SIGTERM을 받으면 처리 중 요청까지는 끝내고 종료
server:
  shutdown: graceful

# ALB 헬스체크용. health 외 엔드포인트는 민감정보라 노출 금지
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never # 상세 상태는 숨김
  health:
    redis:
      enabled: false # Redis 장애로 앱 전체가 unhealthy 판정되는 것 방지

# 이 파일은 전 환경 공통(정책값과 불변 엔드포인트)만 담는다.
# datasource와 redis는 프로파일 yml 소유 (dev=SSM 로드, local=docker compose 표준값).
# 환경마다 달라지는 값(CORS origin, 웹 로그인 return/callback URL, forward-headers)은 application-{profile}.yml로.
# 카카오 REST 키와 JWT 키는 파일에 저장하지 않는다. local은 .env, prod는 SSM에서 주입한다.

api:
  base-path: /api/v1         # 컨트롤러 접두(WebConfig), Security 매처, 온보딩 화이트리스트, 쿠키 Path가 함께 참조

aws:
  s3:
    # local은 .env로 dev 버킷을 지정한다. 값이 없으면 URL 발급 시 실패하며, dev와 prod에서는 시작할 때 필수 값을 검사한다.
    media-bucket: ${AWS_S3_MEDIA_BUCKET:}
    docs-bucket: ${AWS_S3_DOCS_BUCKET:}
    # 미디어 키를 공개 URL로 바꿀 때 사용할 CDN 도메인. 값이 없으면 상대 경로(/key)를 반환한다.
    media-public-base-url: ${AWS_S3_MEDIA_PUBLIC_BASE_URL:}
  ses:
    # SES에서 검증한 발신 주소. 값이 없으면 발송만 실패하며 dev와 prod에서는 SSM으로 주입한다.
    from: ${AWS_SES_FROM:}

# 문의 접수 알림. 기본 off라 로컬은 발송 생략하고 정상 기동.
# dev와 prod에서만 enabled=true로 설정한다. 이때 recipients나 aws.ses.from이 없으면 애플리케이션이 시작되지 않는다.
inquiry:
  notification:
    enabled: ${INQUIRY_NOTIFICATION_ENABLED:false}
    recipients: ${INQUIRY_OPS_RECIPIENTS:}

auth:
  token:
    access-ttl: 30m          # 팀에서 기간을 확정하기 전까지 사용할 기본값
    refresh-ttl: 7d          # 주 1회 이상 접속하면 로그인 유지(회전마다 리셋), 7일 미접속 시 재로그인
    rotation-grace: 60s
  jwt:
    # RS256 PEM 키. prod는 SSM(/aechak/{env}/auth/jwt-private-key)에서 주입한다.
    # local에서 값이 없으면 개발용 임시 키를 생성하며 재시작 시 기존 토큰은 모두 무효화된다.
    private-key: ${AUTH_JWT_PRIVATE_KEY:}
    public-key: ${AUTH_JWT_PUBLIC_KEY:}
  rejoin:
    blocked-period: 30d
  web:
    # 서버 콜백 로그인 정책값. return 화이트리스트와 콜백 주소는 환경별 프로파일에서 정의한다.
    state-ttl: 5m
  social:
    providers:
      kakao:
        jwks-uri: https://kauth.kakao.com/.well-known/jwks.json
        issuer: https://kauth.kakao.com
        authorize-uri: https://kauth.kakao.com/oauth/authorize   # 웹 로그인 진입(서버 콜백 플로우)
        token-uri: https://kauth.kakao.com/oauth/token           # authorization code를 id_token으로 교환하는 주소
        client-id: ${KAKAO_CLIENT_ID:}   # 카카오 REST API 키 (비면 웹 로그인과 code 채널 비활성)
        client-secret: ${KAKAO_CLIENT_SECRET:}   # 카카오 콘솔 보안 설정을 사용하면 필수이며, 없으면 KOE010 오류가 발생한다.
        audiences: [ ]        # 채널별 키 병기: 네이티브 앱 키 + REST 키 (비면 aud 검증 생략)
      apple:
        jwks-uri: https://appleid.apple.com/auth/keys
        issuer: https://appleid.apple.com
        audiences: [ ]        # 채널별 키 병기: iOS 번들 ID + 웹(SIWA JS) Services ID
# PENDING_ONBOARDING 허용 경로는 SecurityConfig.onboardingAllowedPaths 상수로 관리(인가 규칙이라 설정이 아닌 코드 소유)

# PII 암호화 키는 dev와 prod에서 SSM으로 주입하고, local과 test에서는 프로파일의 고정 키를 사용한다.
# 키가 없으면 애플리케이션 시작을 중단한다. 임시 키를 사용하면 재시작 후 기존 데이터를 복호화할 수 없다.
aechak:
  pii:
    active-version: 1        # 암호화에 쓸 키 버전. 로테이션 시 새 버전 키를 aes-keys에 추가하고 이 값을 올린다
    aes-keys:
      1: ${PII_AES_KEY_V1}   # base64 32바이트
    hmac-key: ${PII_HMAC_KEY} # 검색용 base64 32바이트 해시 키. AES 키와 분리해 관리한다.
