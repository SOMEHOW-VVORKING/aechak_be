spring:
  application:
    name: aechak-api
# TODO: ERD 확정 후 실 DB datasource 설정 — 지금은 내장 H2 자동 구성으로 기동
# Redis는 자동 구성 기본값(localhost:6379) — 커넥션은 lazy라 서버 없이도 기동된다

auth:
  token:
    access-ttl: 30m          # 수치 미확정(design Open Question) — 기본 제안값
    refresh-ttl: 30d
    rotation-grace: 60s
  jwt:
    # RS256 PEM — prod는 SSM(/aechak/{env}/auth/jwt-private-key) 주입, local은 .env.
    # 비워두면 개발용 임시 키 생성(재시작 시 기존 토큰 전부 무효 — local 한정).
    private-key: ""
    public-key: ""
# PENDING_ONBOARDING 허용 경로는 UserStatusFilter.ONBOARDING_ALLOWED_PATHS 상수로 관리(결정 문서 Q7)
