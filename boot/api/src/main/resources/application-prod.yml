# prod — 값은 부팅 시 SSM /aechak/prod/api/ 에서 로드(아래 import). yml은 어떤 값이 필요한지 명시하는 계약서
spring:
  config:
    import: aws-parameterstore:/aechak/prod/api/   # prod 인프라 구축 시 이 경로에 파라미터를 만들어야 부팅됨
  datasource:
    url: ${SPRING_DATASOURCE_URL}           # 필수 — 미존재 시 부팅 실패(fail-fast)
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}   # 필수 — 미존재 시 부팅 실패(fail-fast)

api:
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}       # 예: https://aechak.com

aws:
  s3:
    media-bucket: ${AWS_S3_MEDIA_BUCKET}
    docs-bucket: ${AWS_S3_DOCS_BUCKET}

auth:
  web:
    return-urls: ${AUTH_WEB_RETURN_URLS:}              # 예: https://aechak.com/login/complete
    callback-base-url: ${AUTH_WEB_CALLBACK_BASE_URL:}  # 예: https://api.aechak.com/api/v1/auth/callback

server:
  forward-headers-strategy: framework   # LB가 TLS를 종료해도 원 요청 스킴 기준으로 동작(Secure 쿠키·리다이렉트 URL)

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
