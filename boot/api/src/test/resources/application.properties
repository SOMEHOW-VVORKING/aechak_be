# 테스트는 Testcontainers MySQL + ddl-auto(create)로 엔티티 테이블을 만들므로 마이그레이션, 시드를 끈다.
# 마이그레이션이 있어야 하는 컨텍스트는 KafkaIntegrationTestBase가 따로 켠다.
spring.flyway.enabled=false

# TEST/LOCAL 전용 고정 PII 키 — 실환경 사용 금지 (application-local.yml과 동일 값)
aechak.pii.aes-keys.1=dxeyFW4YgkgYreLe9IX7laeZPHaP3Eada2M9yuBCA+Q=
aechak.pii.hmac-key=Jtk5KHlAG6nnDtIBDhqoDXIs7FovvRs0kOckZP6cl7k=

# store-id·channel-key는 결제 준비 응답으로 그대로 나가 PaymentPrepareIntegrationTest가 이 값을 단언함.
payment.store.id=store-test-1
payment.store.channel-key=channel-key-test-1

# 웹훅 서명 검증을 실제로 태우기 위한 고정 시크릿 — PaymentWebhookIntegrationTest가 이 값으로 서명한다.
payment.portone.webhook-secret=whsec_dGVzdC13ZWJob29rLXNlY3JldC1rZXktMTIzNDU2

# 대사는 Fake 소스(IntegrationTestConfig)로 돈다 — 실 포트원 소스를 조립하면 시크릿 없이 실 API로 나간다.
payment.reconciliation.portone.enabled=false

# @SpringBootTest 는 properties 조합이 다르면 컨텍스트를 따로 캐싱하고, 캐시된 컨텍스트는 JVM 이
# 끝날 때까지 각자 Hikari 풀을 들고 있다. 지금 :api 테스트에는 그런 컨텍스트가 16개라, Hikari
# 기본값(최대 10, 유휴 최소=최대)이면 160개를 잡아 Testcontainers MySQL 의 max_connections
# (8.4 기본 151)를 넘긴다. 그러면 풀 밖에서 raw 커넥션을 여는 마이그레이션 테스트가 먼저 거절당한다
# — V43/V58 테스트가 SQLNonTransientConnectionException, Dialect 결정 실패로 깨진 원인이다.
# 컨텍스트가 하나 늘 때마다 10개씩 늘어 경계를 넘나들었으므로 상한을 6(최대 96개)으로 낮춰 여유를 둔다.
# 테스트는 병렬 포크가 없어 컨텍스트 하나가 6개를 동시에 쓸 일이 없다.
spring.datasource.hikari.maximum-pool-size=6
spring.datasource.hikari.minimum-idle=0
