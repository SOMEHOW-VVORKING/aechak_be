# dev 서버 — 값은 부팅 시 SSM /aechak/dev/seller/ 에서 로드(아래 import). yml은 어떤 값이 필요한지 명시하는 계약서
spring:
  config:
    import: aws-parameterstore:/aechak/dev/seller/   # SSM 접근 실패(권한·네트워크) 시 부팅 실패
  datasource:
    url: ${SPRING_DATASOURCE_URL}           # RDS - 필수, 미존재 시 부팅 실패(fail-fast)
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      # RDS 가 db.t4g.micro 라 max_connections 가 약 60 이다. 보트 넷이 각자 기본 10 을 잡고
      # 롤링 배포에서 구형·신형 태스크가 겹치면 두 배가 되어 1040(Too many connections)이 난다.
      # 셀러센터는 동시 사용자가 적다
      maximum-pool-size: 4
      minimum-idle: 1
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}       # ElastiCache
      port: ${SPRING_DATA_REDIS_PORT}
  jpa:
    hibernate:
      ddl-auto: none                        # 스키마 writer는 api 하나 — seller가 같이 update하면 경합한다
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}   # 필수 — 없으면 검수 요청이 발행되지 않는다
    # api와 같은 값으로 맞춘다. 생산자만 쓰고 소비자 설정은 두지 않는다.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000

api:
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}       # 셀러센터 웹 오리진 (쉼표 구분)

aws:
  s3:
    media-bucket: ${AWS_S3_MEDIA_BUCKET}
    docs-bucket: ${AWS_S3_DOCS_BUCKET}

auth:
  jwt:
    # 공개키만 주입 = 검증 전용 모드(JwtConfig) — 토큰 발급은 api 소관이라 seller는 서명 키를 보유하지 않는다
    public-key: ${AUTH_JWT_PUBLIC_KEY}      # 필수 — 없으면 임시 키 폴백으로 api 토큰 전부 401이 된다

# 발송 EP는 없지만 application.user 스캔이 전화 인증 빈(CoolSmsSender)을 올려 필수 프로퍼티가 요구된다
sms:
  coolsms:
    api-key: ${COOLSMS_API_KEY}
    api-secret: ${COOLSMS_API_SECRET}
    from: ${COOLSMS_FROM}             # CoolSMS 콘솔에 등록·인증된 발신번호

server:
  forward-headers-strategy: framework   # LB가 TLS를 종료해도 원 요청 스킴 기준으로 동작

# AI 검수. 섀도 단계에서는 요청만 보내고 노출 상태는 바꾸지 않는다.
inspection:
  enabled: true
  # 셀러 이의 제기 폭주 방지. 관리자 큐를 셀러 한 명이 혼자 채우면 사람이 보는 큐가 쓸모없어짐.
  # max-open-per-seller는 최선 노력이다 — 잠그는 것이 상품 행이라 서로 다른 상품에 동시에 쏘면
  # 같은 분모를 읽는다. 실제 상한은 그 셀러가 가진 차단된 상품 수다
  appeal:
    max-open-per-seller: 3
    cooldown-hours: 24
