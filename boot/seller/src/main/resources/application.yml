spring:
  application:
    name: aechak-seller-api
  lifecycle:
    timeout-per-shutdown-phase: 20s
  task:
    execution:
      # 전용 실행기 빈이 있으면 기본 실행기를 안 만드는 게 기본값. 그러면 이름 없는 @Async가 전용 풀로 흘러듦
      mode: force

  jpa:
    open-in-view: false
  cloud:
    aws:
      region:
        static: ap-northeast-2 # 리전 자동탐지 제거 — CI 러너처럼 AWS 설정 없는 환경에선 탐지 실패로 부팅이 깨짐

# 로그 레벨 옆에 traceId — api와 동일 포맷(로그 수집 파이프라인 공유 전제)
logging:
  pattern:
    level: "%5p [%X{traceId:-}]"

# ECS 롤링 시 SIGTERM을 받으면 처리 중 요청까지는 끝내고 종료
server:
  shutdown: graceful

# ALB 헬스체크용. health 외 엔드포인트는 민감정보라 노출 금지
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    redis:
      enabled: false

# 이 파일은 전 환경 공통만 담는다. datasource·redis는 프로파일 yml 소유.
# flyway 설정이 없는 이유: 스키마 관리는 api가 유일 소유자 — seller는 마이그레이션을 수행하지 않는다.

api:
  base-path: /api/v1         # 호스트로 분리되므로 접두는 api와 동일 — FE가 경로를 바꿀 필요가 없다

aws:
  s3:
    media-bucket: ${AWS_S3_MEDIA_BUCKET:}
    docs-bucket: ${AWS_S3_DOCS_BUCKET:}
    media-public-base-url: ${AWS_S3_MEDIA_PUBLIC_BASE_URL:}

auth:
  token:
    access-ttl: 30m          # 검증에만 쓰이지만 JwtConfig(web-security)가 TokenPolicy 빈을 요구 — api와 값 일치 유지
    refresh-ttl: 7d
    rotation-grace: 60s
  jwt:
    # RS256 PEM — 토큰 발급은 api 소관, 여기선 서명 검증(public)만 실질 사용. api와 같은 키를 주입한다.
    private-key: ${AUTH_JWT_PRIVATE_KEY:}
    public-key: ${AUTH_JWT_PUBLIC_KEY:}

product:
  draft:
    autofill:
      # 셀러당 초안 받기 쿨다운. 연타가 모델을 여러 번 부르는 것을 막는 유일한 BE 장치다.
      # 비용 천장은 여기가 아니라 Anthropic 워크스페이스 spend limit 이다.
      cooldown: 20s

order:
  # 발송 기한. 주문일로부터 이 일수(역일)가 지나도 발송되지 않은 건을 대시보드가 배송 지연으로 센다.
  dispatch:
    sla-days: 3
  auto-confirm:
    days: 5    # 배송완료부터 구매확정 기한까지 — 셀러 수동 전이와 배치 자동 전이가 같은 값을 쓴다

# PII 암호화 키 — api와 동일 키(같은 DB의 같은 암호문을 복호). 미주입이면 부팅 실패(fail-fast).
aechak:
  # AI 폼 초안 서버. base-url 또는 shared-secret 이 비면 어댑터를 조립하지 않는다 -> 전건 UNAVAILABLE.
  # 즉 값이 없는 local·test 는 그대로 뜨고, 셀러는 빈 폼을 그대로 받는다.
  # 비용 kill switch 는 여기가 아니라 AI 쪽 AECHAK_AI_ENABLE_DRAFT 다 — 돈이 나가는 쪽에 둔다.
  ai:
    draft:
      base-url: ${AECHAK_AI_DRAFT_BASE_URL:}
      shared-secret: ${AECHAK_AI_DRAFT_SHARED_SECRET:}
      connect-timeout: 2s
      read-timeout: 30s        # AI 쪽 draft_timeout_seconds=25 보다 넉넉히 — 그쪽이 먼저 끊고 사유를 적게 둔다
  pii:
    active-version: 1
    aes-keys:
      1: ${PII_AES_KEY_V1}
    hmac-key: ${PII_HMAC_KEY}
