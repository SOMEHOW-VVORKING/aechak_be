# 테스트는 Testcontainers MySQL + ddl-auto(create)로 엔티티 테이블을 만든다. datasource는 BatchIntegrationTestBase가 주입.

# TEST/LOCAL 전용 고정 PII 키 — 실환경 사용 금지 (api 테스트와 동일 값)
aechak.pii.aes-keys.1=dxeyFW4YgkgYreLe9IX7laeZPHaP3Eada2M9yuBCA+Q=
aechak.pii.hmac-key=Jtk5KHlAG6nnDtIBDhqoDXIs7FovvRs0kOckZP6cl7k=

# 스모크는 조립만 본다 — 스케줄이 실제로 포트원을 부르지 않게 먼 미래의 cron
payment.reconciliation.cron=0 0 0 29 2 *

# 구매확정 자동 배치 — 테스트가 직접 호출하므로 켜 두고, cron은 스스로 돌지 않게 먼 미래로 둔다
order.auto-confirm.enabled=true
order.auto-confirm.cron=0 0 0 29 2 *
order.auto-confirm.scan-size=2

# 만료 스케줄은 조립해 두고 타이머 등록만 끈다(-) — 테스트가 run()을 직접 부른다
order.expiry.enabled=true
order.expiry.cron=-
# 페이지를 1건으로 줄여 커서 진행을 실제로 태운다 — 100건이면 한 페이지에 다 들어와 커서가 검증되지 않는다
order.expiry.page-size=1

# 환불 집행 스케줄도 조립만 확인한다 — 타이머 등록은 끄고(-) 돈이 실제로 나가는 경로를 테스트가 자동으로 밟지 않게 한다
order.claim.refund.enabled=true
order.claim.refund.cron=-

# 자동승인 스케줄도 조립만 확인한다 — 타이머 등록은 끄고(-) 테스트가 run()을 직접 부른다
order.claim.auto-approve.enabled=true
order.claim.auto-approve.cron=-
