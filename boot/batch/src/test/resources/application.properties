# 구매확정 자동 배치 — 테스트가 직접 호출하므로 켜 두고, cron은 스스로 돌지 않게 먼 미래로 둔다
order.auto-confirm.enabled=true
order.auto-confirm.cron=0 0 0 29 2 *
order.auto-confirm.scan-size=2
