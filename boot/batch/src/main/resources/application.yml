spring:
  application:
    name: aechak-batch
  cloud:
    aws:
      region:
        static: ap-northeast-2 # 리전 자동탐지 제거 — CI 러너처럼 AWS 설정 없는 환경에선 탐지 실패로 부팅이 깨짐
  jpa:
    hibernate:
      ddl-auto: none   # 스키마 관리는 api(Flyway)만
  task:
    scheduling:
      pool:
        size: 8        # 아웃박스 스위퍼(5초 주기)와 대사·주문·정산 스케줄이 서로를 막지 않게. 각 스케줄은 fixedDelay/cron이라 자기 겹침은 없다

  # 정책값은 api application.yml과 동일하게 유지. 브로커 주소만 프로파일 yml 소유
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer   # value = 엔벨로프 JSON 문자열
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"

# 이 파일은 전 환경 공통(정책값)만 담는다. datasource·카프카 주소는 프로파일 yml 소유.

aws:
  s3:
    # 장바구니 파사드가 요구하는 FileStorage 조립용 — 배치는 파일을 다루지 않지만 조립 의존이라 비워 두면 안 된다
    media-bucket: ${AWS_S3_MEDIA_BUCKET:}
    docs-bucket: ${AWS_S3_DOCS_BUCKET:}
    media-public-base-url: ${AWS_S3_MEDIA_PUBLIC_BASE_URL:}

settlement:
  execution:
    # 기본값 false — 셀러 지급 건을 만드는 경로다. 지급 건에 묶인 정산은 다음 회차가 다시 집지 않으므로 환경별로 확인한 뒤 켠다
    enabled: ${SETTLEMENT_EXECUTION_ENABLED:false}
    cron: "0 0 5 * * *"                        # KST 05:00 — 결제 대사(04:30)가 끝난 뒤. 기준일은 실행 당일(KST)

payment:
  portone:
    base-url: https://api.portone.io
    api-secret: ${PORTONE_API_SECRET:}       # 대사 목록 조회·확정 본체의 재조회가 쓴다. 비면 대사 회차가 실패로 기록된다
    webhook-secret: ${PORTONE_WEBHOOK_SECRET:} # 배치는 웹훅을 받지 않지만 PaymentFacade 조립에 검증기가 딸려온다
    store-id: ${PORTONE_STORE_ID:}             # 취소 요청에 실을 상점. 비면 API 시크릿의 상점이 쓰인다
  # 취소 1건의 금액 상한. 기본 0 = 취소를 PG로 내보내지 않는다. api와 같은 기준으로 둔다
  cancel:
    max-amount: ${PAYMENT_CANCEL_MAX_AMOUNT:0}
  reconciliation:
    cron: "0 30 4 * * *"                       # KST 04:30 — 전날 승인·취소·웹훅 재전송(최대 5.7시간)이 가라앉은 뒤
    portone:
      enabled: true
      is-test: ${PORTONE_RECONCILIATION_IS_TEST:} # dev(테스트 채널)는 true, prod는 false. 비우면 구분 없이 전부
  toss:
    enabled: ${TOSS_RECONCILIATION_ENABLED:false} # 토스 직접 연동(orderId == 우리 결제 식별자)을 확인한 환경만 켠다
    secret-key: ${TOSS_SECRET_KEY:}

order:
  auto-confirm:
    days: 5    # 배송완료부터 구매확정 기한까지 — 셀러 수동 전이와 배치 자동 전이가 같은 값을 쓴다
    # 자동확정은 되돌릴 수 없고 반품 기한·정산의 기산점이라 기본은 꺼 둔다. 환경변수로 환경별로 켠다
    enabled: ${ORDER_AUTO_CONFIRM_ENABLED:false}
    cron: "0 0 2 * * *"      # KST 02:00 — 배송완료 집계가 끝난 뒤, 대사(04:30)보다 앞
    notify-lead-days: 1      # 기한 D-1 구간의 주문에 사전 안내 기록을 남긴다
    scan-size: 200           # 한 회차 안에서 커서로 끊어 읽는 건수
  delivery:
    # 배치 모듈이 dev에 배포되기 전까지는 꺼 둔다 — 켜면 시간만 보고 주문을 배송완료로 넘긴다
    enabled: ${ORDER_DELIVERY_BATCH_ENABLED:false}
    cron: "0 0 3 * * *"       # KST 03:00 — 대사(04:30)와 겹치지 않게 앞에 둔다
    dispatch-delay-days: 1    # 송장 등록 후 1일이 지나도 배송완료가 아니면 집화 지연으로 경고
    auto-complete-days: 4     # 송장 등록 후 4일이 지나면 배송완료로 자동 전이
    scan-limit: 200
    tracking:
      # 기본값 false — 지금 조립할 수 있는 추적 어댑터가 목뿐이라, 켜면 표식이 붙은 가짜 상태가 DB에 쌓여 화면에 뜬다.
      # 실제 택배사 어댑터가 붙은 환경에서만 켠다
      enabled: ${ORDER_DELIVERY_TRACKING_ENABLED:false}
      cron: "0 0 */6 * * *"   # KST 00·06·12·18시 — 다른 배치 시각(02·03·04:30·05)과 겹치지 않게
      scan-limit: 200         # 한 페이지에 읽을 건수. 회차는 커서로 페이지를 넘기며 전부 처리한다
      mock:
        # 기본값 false. 켜면 택배사를 부르지 않고 '[모의]' 표식이 붙은 가짜 상태를 돌려준다 —
        # 운영 프로파일에서는 켜도 어댑터가 조립되지 않는다
        enabled: ${ORDER_DELIVERY_TRACKING_MOCK_ENABLED:false}
  claim:
    refund:
      # 기본값 false — 실제로 PG 환불이 나가는 경로다. dev 상점이 테스트 상점인지 확인한 뒤 켠다
      enabled: ${ORDER_CLAIM_REFUND_ENABLED:false}
      cron: "0 * * * * *"   # 매분 — 승인과 환불 사이의 "승인됐는데 돈은 안 나갔다" 구간을 짧게 둔다
      page-size: 50         # 한 회차 처리 건수. 집행된 건은 스캔 조건에서 빠지므로 커서가 필요 없다
    auto-approve:
      # 기본값 false. 켜도 refund.enabled가 false면 스케줄이 조립되지 않는다 — 자동승인은 환불 집행까지 간다
      enabled: ${ORDER_CLAIM_AUTO_APPROVE_ENABLED:false}
      cron: "0 10 * * * *" # 매시 10분 — 응답 기한이 일 단위라 분 단위로 볼 이유가 없다
      page-size: 50        # 한 회차 처리 건수. 승인된 건은 스캔 조건에서 빠지므로 커서가 필요 없다
  expiry:
    # 기본값 false — 환불 집행이 붙기 전까지는 승인과 경합에서 취소가 이긴 건을 되돌릴 경로가 없다
    enabled: ${ORDER_EXPIRY_ENABLED:false}
    cron: "0 * * * * *"   # 매분 — 주문서 TTL이 10분이라 분 단위로 충분하다
    page-size: 100        # 스캔 한 페이지 건수
    max-pages: 10         # 한 회차 페이지 상한. 남은 적체는 다음 회차가 이어 받는다

# PII 암호화 키 — api와 동일 키(같은 데이터를 복호). dev·prod는 SSM, local·test는 프로파일 파일의 고정 키가 덮는다.
aechak:
  pii:
    active-version: 1
    aes-keys:
      1: ${PII_AES_KEY_V1}
    hmac-key: ${PII_HMAC_KEY}
