# 로컬 개발용 백킹 서비스 — 프로덕션과 버전·설정 미러링이 원칙
#   MySQL 8.4  ← RDS와 동일 (utf8mb4 / utf8mb4_0900_ai_ci / Asia/Seoul, rds.tf 파라미터그룹과 일치)
#   Kafka 3.8.0 KRaft 단일노드 ← EC2 카프카(user_data)와 동일
# 앱은 여기 안 담는다 — IDE에서 bootRun (핫리로드·디버거). 프로드의 컨테이너 명세는 ECS taskdef가 담당.
#
# 실행:  docker compose up -d      중지: docker compose down      초기화: docker compose down -v

services:
  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: aechak
      MYSQL_USER: app
      MYSQL_PASSWORD: local
      MYSQL_ROOT_PASSWORD: local
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-plocal"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.2 # 프로드 ElastiCache는 7.1 (지원 상한) — 마이너 한 끗 차이 수용
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
  kafka-data:
