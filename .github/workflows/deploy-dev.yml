# dev 자동 배포: develop 푸시 → 바뀐 것 감지 → 인프라(terraform apply) 먼저, 그 다음 바뀐 모듈 배포
# 수동 재배포는 deploy-dev-<모듈>.yml. terraform 수동 apply는 급한 장애 대응 때만 (기본은 이 파이프라인)
# 새 배포물(예: batch) 추가 = detect filters에 경로 추가 + deploy-dev-<모듈>.yml 생성 + deploy-<모듈> job 복사 (seller-api가 그 선례)

name: deploy-dev

on:
  push:
    branches: [develop] # AWS의 OIDC 신뢰 조건이 develop 한정 — 다른 브랜치에선 인증 자체가 거부됨

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false # 배포 직렬화 — 연속 푸시가 동시에 인프라·ECS를 건드리면 순서가 꼬임

jobs:
  detect:
    # 변경 감지 — 안 바뀐 것까지 매번 배포하는 낭비 방지
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      seller-api: ${{ steps.filter.outputs.seller-api }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # push 전후 diff 계산에 히스토리 필요
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # 화이트리스트 방식 — 목록에 없는 변경(docs 등)은 배포를 유발하지 않음
          filters: |
            infra:
              - 'terraform/**'
            # 공유 코드는 그걸 싣는 모든 모듈 필터에 넣는다 — 빠지면 그 코드만 바뀐 푸시가 배포를 안 태운다
            api:
              - 'boot/api/**'
              - 'domain/**'
              - 'application/**'
              - 'common/**'
              - 'web-common/**'
              - 'web-security/**'
              - 'message/**'
              - 'pii/**'
              - 'infra/**'
              - 'gradle/**'
              - 'gradlew*'
              - 'gradle.properties'
              - 'settings.gradle.kts'
              - 'build-logic/**'
              - 'Dockerfile'
              - '.dockerignore'
              - '.github/workflows/deploy-module.yml'
            seller-api:
              - 'boot/seller/**'
              - 'domain/**'
              - 'application/**'
              - 'common/**'
              - 'web-common/**'
              - 'web-security/**'
              - 'pii/**'
              - 'infra/**'
              - 'gradle/**'
              - 'gradlew*'
              - 'gradle.properties'
              - 'settings.gradle.kts'
              - 'build-logic/**'
              - 'Dockerfile'
              - '.dockerignore'
              - '.github/workflows/deploy-module.yml'

  deploy-infra:
    # terraform apply — 인프라가 앱보다 먼저 반영돼야 앱이 새 설정(SSM 등)을 읽을 수 있음
    needs: detect
    if: needs.detect.outputs.infra == 'true'
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_REGION: ap-northeast-2
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }} # 배포 role과 분리 — 인프라 관리 권한은 경계가 다름
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false # 래퍼가 stdout을 가공해 로그가 지저분해지는 것 방지

      - name: Terraform apply
        # 사람 게이트는 PR 리뷰(코드) + prod 봉인(variables.tf가 env=dev만 허용) — 여긴 dev만 닿을 수 있음
        run: |
          terraform init -input=false -no-color
          terraform apply -auto-approve -input=false -no-color -var-file=envs/dev.tfvars

  deploy-api:
    # 인프라가 먼저: infra 변경 시 새 taskdef·SSM이 준비된 뒤 재배포해야 반영됨 (infra만 바뀌어도 재배포하는 이유)
    needs: [detect, deploy-infra]
    # deploy-infra가 스킵(인프라 무변경)이어도 앱 배포는 진행, 실패면 중단 — 반쪽 반영 방지
    if: ${{ !cancelled() && needs.deploy-infra.result != 'failure' && (needs.detect.outputs.api == 'true' || needs.detect.outputs.infra == 'true') }}
    permissions:
      id-token: write # OIDC 신분증 발급 권한 — 이게 없으면 AWS 인증이 실패함
      contents: read
    uses: ./.github/workflows/deploy-dev-api.yml # 수동 배포와 같은 정의 — 배포 파라미터는 저 파일에만 존재
    secrets: inherit # 재사용 워크플로는 secrets 자동 상속이 안 됨 — 없으면 role ARN이 빈 값으로 넘어가 AWS 인증 실패

  deploy-seller-api:
    needs: [detect, deploy-infra]
    if: ${{ !cancelled() && needs.deploy-infra.result != 'failure' && (needs.detect.outputs.seller-api == 'true' || needs.detect.outputs.infra == 'true') }}
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-dev-seller-api.yml
    secrets: inherit
