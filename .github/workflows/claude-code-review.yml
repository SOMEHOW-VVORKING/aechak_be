name: Claude Code Review

# develop 대상 PR을 Claude가 자동 리뷰한다. 리뷰 기준: 저장소 루트 REVIEW.md
#
# ── 세팅 (레포에 1회) ────────────────────────────────────────────────
# 인증: Claude Max 구독 OAuth 토큰(API 키 아님). 팀원 3명 토큰을 라운드로빈으로 돌려 사용량 분산.
#   1) 각자 로컬에서:  claude setup-token   → 출력된 토큰 복사 (자동 저장 안 됨)
#   2) 레포 Settings → Secrets and variables → Actions 에 3개 등록:
#        CLAUDE_OAUTH_TOKEN_1 / CLAUDE_OAUTH_TOKEN_2 / CLAUDE_OAUTH_TOKEN_3   (팀원별 하나씩)
#   ⚠️ 토큰은 1년 만료·수동 갱신 — 만료되면 해당 슬롯 리뷰가 인증 실패로 죽는다.
#   ⚠️ private repo는 GitHub Actions 사용 시간(분)이 과금 대상이고, 리뷰를 위해 PR diff가 Anthropic으로 전송된다.
#   ⚠️ 개인 구독 3개 풀링은 구독 약관상 회색지대 — 팀이 인지하고 사용.
# ─────────────────────────────────────────────────────────────────────

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
    branches: [develop]
    # 문서만 바뀐 PR은 리뷰하지 않는다 (구독 사용량 절약)
    paths-ignore:
      - 'docs/**'
      - 'knowledge-base/**'
      - '**/*.md'

# 같은 PR에 커밋이 연달아 푸시되면 진행 중이던 리뷰를 취소하고 최신 커밋만 리뷰
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read        # PR 코드 체크아웃·읽기
  pull-requests: write  # 리뷰 코멘트 작성
  actions: read         # Claude가 PR의 CI 실행 결과를 읽는 데 필요

jobs:
  claude-review:
    # draft PR·봇 PR은 리뷰하지 않는다 (낭비·무한루프 방지)
    if: >
      github.event.pull_request.draft == false &&
      !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # PR 번호 기준 라운드로빈으로 3명 중 한 명의 토큰 슬롯 선택 (1→2→3→1…)
      - name: Pick reviewer token slot
        id: pick
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "n=$(( PR_NUMBER % 3 + 1 ))" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1  # 액션이 PR을 자체 클론하므로 전체 히스토리 불필요

      # 선택된 슬롯의 시크릿이 비어있으면(오타·미등록) 조용한 인증 실패 대신 명확히 중단
      - name: Guard — selected token must exist
        env:
          TOKEN: ${{ secrets[format('CLAUDE_OAUTH_TOKEN_{0}', steps.pick.outputs.n)] }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::CLAUDE_OAUTH_TOKEN_${{ steps.pick.outputs.n }} 시크릿이 비어있음 — 이름·등록 확인"
            exit 1
          fi
          echo "reviewer slot #${{ steps.pick.outputs.n }} 토큰 확인됨"

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          # 라운드로빈으로 선택된 슬롯의 OAuth 토큰 (토큰 값이 셸을 거치지 않음)
          claude_code_oauth_token: ${{ secrets[format('CLAUDE_OAUTH_TOKEN_{0}', steps.pick.outputs.n)] }}

          # 진행 상황을 스티키 코멘트 하나로 갱신 (코멘트 스팸 방지)
          track_progress: true

          prompt: |
            이 PR을 리뷰해줘. 리뷰 기준은 저장소 루트의 REVIEW.md가 정의한다 —
            반드시 REVIEW.md를 먼저 읽고 그 심각도 기준과 체크리스트를 따라라.
            REVIEW.md가 출처로 지목하는 docs/·knowledge-base/ 규범 문서는
            판단에 필요한 부분만 찾아서 읽어라.
            변경된 파일이 속한 레이어의 체크리스트만 적용하고, diff에 없는 코드를
            규범 위반 찾으러 탐색하지 마라.

            출력 규칙:
            - 지적은 해당 코드 라인에 인라인 코멘트로 남긴다.
            - 마지막에 요약 코멘트 하나: 반려급(🔴) 유무 → 중요(🟡) 목록 → 니트(⚪) 요약 순.
            - 반려급·중요 지적에는 근거 문서 위치(예: 10-domain.md §2-1)를 함께 적는다.
            - 모든 코멘트는 한국어로 작성한다.

          claude_args: |
            --model claude-sonnet-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
