name: Lint

on:
  pull_request:
  push:
    branches: [ main, develop ]

# 같은 브랜치에서 새 푸시가 오면 이전 실행은 취소
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # --continue: ktlint가 실패해도 spotless까지 돌려 코틀린·자바 위반을 한 번에 보여준다
      - name: lint
        run: ./gradlew ktlintCheck spotlessCheck --continue
