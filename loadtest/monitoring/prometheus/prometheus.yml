# 수집 주기 5초. 대상은 targets.sh가 상태 디렉터리의 prom-targets/에 쓰는 file SD로 받는다.
# 대상 라벨 host는 api, runner, es 중 하나다.
global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          host: runner

  - job_name: spring
    metrics_path: /actuator/prometheus
    file_sd_configs:
      - files: ["/etc/prometheus/targets/spring*.json"]

  - job_name: node
    file_sd_configs:
      - files: ["/etc/prometheus/targets/node*.json"]

  - job_name: cadvisor
    file_sd_configs:
      - files: ["/etc/prometheus/targets/cadvisor*.json"]

  - job_name: mysqld
    file_sd_configs:
      - files: ["/etc/prometheus/targets/mysqld*.json"]

  - job_name: es
    file_sd_configs:
      - files: ["/etc/prometheus/targets/es*.json"]
